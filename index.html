    // =========================================================================

    // Resize & compress photo via HTML5 Canvas (returns { dataUrl, blob })
    const compressImageFile = (file, maxDimension = 1000, quality = 0.78) => {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onerror = () => reject(new Error("Failed to read image file."));
        reader.onload = (event) => {
          const img = new Image();
          img.onerror = () => reject(new Error("Invalid image format."));
          img.onload = () => {
            let { width, height } = img;
            if (width > maxDimension || height > maxDimension) {
              if (width > height) {
                height = Math.round((height * maxDimension) / width);
                width = maxDimension;
              } else {
                width = Math.round((width * maxDimension) / height);
                height = maxDimension;
              }
            }
            const canvas = document.createElement("canvas");
            canvas.width = width;
            canvas.height = height;
            const ctx = canvas.getContext("2d");
            ctx.drawImage(img, 0, 0, width, height);
            const dataUrl = canvas.toDataURL("image/jpeg", quality);
            canvas.toBlob(
              (blob) => resolve({ dataUrl, blob }),
              "image/jpeg",
              quality
            );
          };
          img.src = event.target.result;
        };
        reader.readAsDataURL(file);
      });
    };

    // Parse Firebase config pasted either as pure JSON or JS object snippet
    const parseFirebaseConfigInput = (rawText) => {
      const trimmed = rawText.trim();
      if (!trimmed) throw new Error("Paste your Firebase config object first.");

      // 1. Try direct JSON parse
      try {
        const parsed = JSON.parse(trimmed);
        if (parsed && parsed.apiKey && parsed.projectId) return parsed;
      } catch (_) {}

      // 2. Extract object braces { ... } and convert unquoted keys / single quotes
      const match = trimmed.match(/\{[\s\S]*\}/);
      if (!match) {
        throw new Error("Could not find a { ... } configuration block.");
      }

      let objLiteral = match[0]
        // Replace single-quoted strings with double-quoted strings
        .replace(/'([^'\\]*(\\.[^'\\]*)*)'/g, '"$1"')
        // Quote unquoted object keys like apiKey: -> "apiKey":
        .replace(/([{,]\s*)([a-zA-Z0-9_]+)\s*:/g, '$1"$2":')
        // Remove trailing commas before }
        .replace(/,\s*}/g, "}");

      const parsed = JSON.parse(objLiteral);
      if (!parsed || !parsed.apiKey || !parsed.projectId) {
        throw new Error("Config must include at least apiKey and projectId.");
      }
      return parsed;
    };

    const getInitialFirebaseConfig = () => {

      try {
        const params = new URLSearchParams(window.location.search);
        const fbParam = params.get("fb");
        if (fbParam) {
          const decoded = JSON.parse(atob(decodeURIComponent(fbParam)));
          if (decoded && decoded.apiKey && decoded.projectId) {
            localStorage.setItem(LS_KEYS.FB_CONFIG, JSON.stringify(decoded));
            return decoded;
          }
        }

        if (saved) {
          const parsed = JSON.parse(saved);
          if (parsed && parsed.apiKey && parsed.projectId) return parsed;

      return null;

      const [newTaskIsTeam, setNewTaskIsTeam] = useState(true);
      const [newTaskP1, setNewTaskP1] = useState("");
      const [newTaskP2, setNewTaskP2] = useState("");

      // Persist active player session ID
      useEffect(() => {
        try {
          if (currentLoggedInPlayerId) {
            localStorage.setItem(LS_KEYS.SESSION_PLAYER, currentLoggedInPlayerId);
          } else {
            localStorage.removeItem(LS_KEYS.SESSION_PLAYER);
          }
        } catch (_) {}
      }, [currentLoggedInPlayerId]);

      // =========================================================================
      // 7. FIREBASE REAL-TIME SYNC ENGINE (WITH AUTOMATIC LOCAL DEMO FALLBACK)
      // =========================================================================
      useEffect(() => {
        if (!firebaseConfig || !firebaseConfig.apiKey || !firebaseConfig.projectId) {
          setFbStatus("demo");
          setFbErrorMsg("");
          dbRef.current = null;
          storageRef.current = null;
          return;
        }

        if (typeof window.firebase === "undefined") {
          setFbStatus("error");
          setFbErrorMsg("Firebase SDK failed to load. Check internet connection.");
          return;
        }

        setFbStatus("connecting");
        setFbErrorMsg("");

        let appInstance;
        try {
          if (window.firebase.apps && window.firebase.apps.length > 0) {
            // Re-use or re-initialize named app if config changed
            const appName = "pooters_" + firebaseConfig.projectId;
            const existing = window.firebase.apps.find((a) => a.name === appName);
            appInstance = existing || window.firebase.initializeApp(firebaseConfig, appName);
          } else {
            appInstance = window.firebase.initializeApp(firebaseConfig);
          }

          const db = appInstance.firestore();
          const storage = appInstance.storage();
          dbRef.current = db;
          storageRef.current = storage;

          const baseDoc = db.collection("pooters_hunt").doc("main_game");

          // Subscribe to Teams
          const unsubTeams = baseDoc.collection("teams").onSnapshot(
            (snap) => {
              setFbStatus("connected");
              const list = snap.docs.map((d) => ({ id: d.id, ...d.data() }));
              setTeams(list);
            },
            (err) => {
              setFbStatus("error");
              setFbErrorMsg(err.message || "Firestore permission denied. Set Firestore rules to test mode.");
            }
          );

          // Subscribe to Players
          const unsubPlayers = baseDoc.collection("players").onSnapshot((snap) => {
            const list = snap.docs.map((d) => ({ id: d.id, ...d.data() }));
            setRegisteredPlayers(list);
          });

          // Subscribe to Tasks
          const unsubTasks = baseDoc.collection("tasks").onSnapshot((snap) => {
            const list = snap.docs.map((d) => ({ id: d.id, ...d.data() }));
            setTasks(list);
          });

          // Subscribe to Progress / Submissions
          const unsubProgress = baseDoc.collection("progress").onSnapshot((snap) => {
            const list = snap.docs.map((d) => ({ id: d.id, ...d.data() }));
            setProgress(list);
          });

          return () => {
            unsubTeams();
            unsubPlayers();
            unsubTasks();
            unsubProgress();
          };
        } catch (err) {
          setFbStatus("error");
          setFbErrorMsg(err.message || "Invalid Firebase configuration.");
        }
      }, [firebaseConfig]);

      // Persist Local Demo Mode changes to localStorage
      useEffect(() => {
        if (fbStatus !== "demo") return;
        try {
          localStorage.setItem(LS_KEYS.TEAMS, JSON.stringify(teams));
        } catch (_) {}
      }, [teams, fbStatus]);

      useEffect(() => {
        if (fbStatus !== "demo") return;
        try {
          localStorage.setItem(LS_KEYS.PLAYERS, JSON.stringify(registeredPlayers));
        } catch (_) {}
      }, [registeredPlayers, fbStatus]);

      useEffect(() => {
        if (fbStatus !== "demo") return;
        try {
          localStorage.setItem(LS_KEYS.TASKS, JSON.stringify(tasks));
        } catch (_) {}
      }, [tasks, fbStatus]);

      useEffect(() => {
        if (fbStatus !== "demo") return;
        try {
          const serializable = progress.map((item) =>
            item.mediaUrl?.startsWith("blob:")
              ? { ...item, mediaUrl: "", isExpiredBlob: true }
              : item
          );
          localStorage.setItem(LS_KEYS.PROGRESS, JSON.stringify(serializable));
        } catch (_) {}
      }, [progress, fbStatus]);

      // Seed starter squads/players/tasks into an empty Firebase Firestore database
      const handleSeedCloudData = async () => {
        if (!dbRef.current) return;
        try {
          const baseDoc = dbRef.current.collection("pooters_hunt").doc("main_game");
          const batch = dbRef.current.batch();

          DEFAULT_TEAMS.forEach((t) => {
            batch.set(baseDoc.collection("teams").doc(t.id), t);
          });
          DEFAULT_PLAYERS.forEach((p) => {
            batch.set(baseDoc.collection("players").doc(p.id), p);
          });
          DEFAULT_TASKS.forEach((task) => {
            batch.set(baseDoc.collection("tasks").doc(task.id), task);
          });

          await batch.commit();
          setErrorModal({
            isOpen: true,
            title: "Cloud Seeded!",
            message: "Starter squads, players, and sample tasks have been pushed to Firebase Firestore!"
          });
        } catch (err) {
          setErrorModal({
            isOpen: true,
            title: "Seed Error",
            message: err.message || "Failed to write starter data to Firestore."
          });
        }
      };

      // Save Firebase Config from Organizer Modal
      const handleSaveFirebaseConfig = () => {
        try {
          const parsed = parseFirebaseConfigInput(fbConfigText);
          localStorage.setItem(LS_KEYS.FB_CONFIG, JSON.stringify(parsed));
          setFirebaseConfig(parsed);
          setFbModalOpen(false);
        } catch (err) {
          setErrorModal({
            isOpen: true,
            title: "Invalid Config",
            message: err.message
          });
        }
      };

      const handleDisconnectFirebase = () => {
        localStorage.removeItem(LS_KEYS.FB_CONFIG);
        setFirebaseConfig(null);
        setFbConfigText("");
        setFbModalOpen(false);
      };

      // Generate a 1-tap Shareable URL containing encoded Firebase config so friends auto-connect
      const handleCopyConnectLink = () => {
        if (!firebaseConfig) return;
        try {
          const encoded = encodeURIComponent(btoa(JSON.stringify(firebaseConfig)));
          const baseUrl = window.location.origin + window.location.pathname;
          const fullUrl = `${baseUrl}?fb=${encoded}`;
          if (navigator.clipboard && navigator.clipboard.writeText) {
            navigator.clipboard.writeText(fullUrl).catch(() => {});
          }
          setCopiedShareLink(true);
          setTimeout(() => setCopiedShareLink(false), 2500);
        } catch (_) {}
      };

      // =========================================================================
      // 8. DERIVED STATE (LIVE PLAYER, TEAM, LEADERBOARD)
      // =========================================================================
      const currentLoggedInPlayer = useMemo(() => {
        if (!currentLoggedInPlayerId) return null;
        return registeredPlayers.find((p) => p.id === currentLoggedInPlayerId) || null;
      }, [currentLoggedInPlayerId, registeredPlayers]);

      const currentTeam = useMemo(() => {
        if (!currentLoggedInPlayer || !currentLoggedInPlayer.teamId) return null;
        return teams.find((t) => t.id === currentLoggedInPlayer.teamId) || null;
      }, [currentLoggedInPlayer, teams]);

      const teamMembers = useMemo(() => {
        if (!currentTeam) return [];
        return registeredPlayers.filter((p) => p.teamId === currentTeam.id);
      }, [currentTeam, registeredPlayers]);

      const leaderBoard = useMemo(() => {
        const scores = {};
        teams.forEach((t) => (scores[t.id] = { ...t, score: 0 }));

        const uniqueTeamTasks = new Set();
        const uniqueSoloTasks = new Set();

        progress.forEach((p) => {
          const task = tasks.find((t) => t.id === p.taskId);
          if (!scores[p.teamId] || !task) return;

          if (task.isTeamTask) {
            const key = `${p.teamId}_${p.taskId}`;
            if (!uniqueTeamTasks.has(key)) {
              uniqueTeamTasks.add(key);
              scores[p.teamId].score += Number(task.points) || 0;
            }
          } else {
            const key = `${p.taskId}`;
            if (!uniqueSoloTasks.has(key)) {
              uniqueSoloTasks.add(key);
              scores[p.teamId].score += Number(task.points) || 0;
            }
          }
        });

        return Object.values(scores).sort((a, b) => b.score - a.score);
      }, [teams, tasks, progress]);

      // =========================================================================
      // 9. MEDIA SELECTION & UPLOAD HANDLERS (CANVAS + FIREBASE STORAGE)
      // =========================================================================
      const handleFileUpload = async (e) => {
        const file = e.target.files?.[0];
        if (!file) return;

        const isVideo =
          file.type.startsWith("video/") || /\.(mp4|mov|webm|m4v|avi)$/i.test(file.name);
        const isImage =
          file.type.startsWith("image/") || /\.(jpg|jpeg|png|gif|webp|heic)$/i.test(file.name);

        if (!isImage && !isVideo) {
          setErrorModal({
            isOpen: true,
            title: "Unsupported File",
            message: "Please choose a photo or video file."
          });
          e.target.value = "";
          return;
        }

        const sizeInMB = (file.size / (1024 * 1024)).toFixed(2);
        setIsProcessingMedia(true);

        try {
          if (isImage) {
            const { dataUrl, blob } = await compressImageFile(file, 1000, 0.78);
            setMediaFileUrl(dataUrl);
            setMediaFileType("image");
            setPendingUploadBlob(blob);
            setMediaFileMeta({
              name: file.name,
              sizeText: `${sizeInMB} MB (Optimized)`,
              isLocalVideoBlob: false
            });
          } else {
            const objectUrl = URL.createObjectURL(file);
            setMediaFileUrl(objectUrl);
            setMediaFileType("video");
            setPendingUploadBlob(file);
            setMediaFileMeta({
              name: file.name,
              sizeText: `${sizeInMB} MB`,
              isLocalVideoBlob: true
            });
          }
        } catch (err) {
          setErrorModal({
            isOpen: true,
            title: "Media Error",
            message: "Could not process that file. Try another photo/video or use the Sample buttons."
          });
        } finally {
          setIsProcessingMedia(false);
          e.target.value = "";
        }
      };

      const handleUrlSubmit = () => {
        if (!mediaUrlInput.trim()) {
          setErrorModal({
            isOpen: true,
            title: "Missing URL",
            message: "Please paste a valid image or video URL."
          });
          return;
        }
        const cleanUrl = mediaUrlInput.trim();
        const isVid = /\.(mp4|webm|ogg|mov)(\?|$)/i.test(cleanUrl) || cleanUrl.includes("video");
        setMediaFileUrl(cleanUrl);
        setMediaFileType(isVid ? "video" : "image");
        setPendingUploadBlob(null);
        setMediaFileMeta({
          name: "External Media Link",
          sizeText: isVid ? "Video URL" : "Image URL",
          isLocalVideoBlob: false
        });
        setMediaUrlInput("");
      };

      const selectSampleMedia = (type) => {
        setPendingUploadBlob(null);
        if (type === "image") {
          setMediaFileUrl(
            "https://images.unsplash.com/photo-1529156069898-49953e39b3ac?auto=format&fit=crop&w=800&q=80"
          );
          setMediaFileType("image");
          setMediaFileMeta({
            name: "Sample_Squad_Photo.jpg",
            sizeText: "Sample Photo",
            isLocalVideoBlob: false
          });
        } else {
          setMediaFileUrl(
            "https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/ForBiggerBlazes.mp4"
          );
          setMediaFileType("video");
          setMediaFileMeta({
            name: "Sample_Challenge_Clip.mp4",
            sizeText: "Sample Video",
            isLocalVideoBlob: false
          });
        }
      };

      const clearSelectedMedia = () => {
        setMediaFileUrl("");
        setMediaFileType("image");
        setMediaFileMeta(null);
        setPendingUploadBlob(null);
        setUploadProgressPct(0);
      };

      // Upload Blob/File to Firebase Storage and return public download URL
      const uploadBlobToFirebaseStorage = (blob, type) => {
        return new Promise((resolve, reject) => {
          if (!storageRef.current) {
            reject(new Error("Firebase Storage not initialized."));
            return;
          }
          const ext = type === "video" ? "mp4" : "jpg";
          const filePath = `pooters_submissions/${Date.now()}_${Math.random()
            .toString(36)
            .slice(2, 8)}.${ext}`;
          const fileRef = storageRef.current.ref().child(filePath);
          const uploadTask = fileRef.put(blob);

          uploadTask.on(
            "state_changed",
            (snapshot) => {
              const pct = Math.round((snapshot.bytesTransferred / snapshot.totalBytes) * 100);
              setUploadProgressPct(pct);
            },
            (error) => reject(error),
            async () => {
              try {
                const downloadUrl = await uploadTask.snapshot.ref.getDownloadURL();
                resolve(downloadUrl);
              } catch (err) {
                reject(err);
              }
            }
          );
        });
      };

      // =========================================================================
      // 10. PLAYER & ORGANIZER CRUD ACTIONS (CLOUD OR LOCAL FALLBACK)
      // =========================================================================
      const handlePlayerLogin = (e) => {
        e.preventDefault();
        const cleanName = playerLoginName.trim().toLowerCase();
        const cleanCode = playerLoginCode.trim();

        const foundPlayer = registeredPlayers.find(
          (p) =>
            p.displayName.trim().toLowerCase() === cleanName &&
            p.secretCode.trim() === cleanCode
        );

        if (foundPlayer) {
          setCurrentLoggedInPlayerId(foundPlayer.id);
        } else {
          setErrorModal({
            isOpen: true,
            title: "Login Notice",
            message: "Invalid player name or secret code. Check with your organizer!"
          });
        }
      };

      const quickFillDemoPlayer = (player) => {
        setPlayerLoginName(player.displayName);
        setPlayerLoginCode(player.secretCode);
      };

      const handleOrganizerAuth = (e) => {
        e.preventDefault();
        if (organizerPasswordInput === ORGANIZER_PASSWORD) {
          setIsOrganizerAuthed(true);
          setPortalMode("organizer");
        } else {
          setErrorModal({
            isOpen: true,
            title: "Access Denied",
            message: "Incorrect organizer password."
          });
        }
      };

      // Squads CRUD
      const handleAdminAddTeam = async (e) => {
        e.preventDefault();
        if (!newTeamName.trim()) return;
        const id = "team_" + Date.now();
        const newTeam = { id, name: newTeamName.trim(), color: newTeamColor };
        setNewTeamName("");

        if (fbStatus === "connected" && dbRef.current) {
          await dbRef.current
            .collection("pooters_hunt")
            .doc("main_game")
            .collection("teams")
            .doc(id)
            .set(newTeam);
        } else {
          setTeams((prev) => [...prev, newTeam]);
        }
      };

      const handleDeleteTeam = async (teamId) => {
        if (fbStatus === "connected" && dbRef.current) {
          const baseDoc = dbRef.current.collection("pooters_hunt").doc("main_game");
          const batch = dbRef.current.batch();
          batch.delete(baseDoc.collection("teams").doc(teamId));
          registeredPlayers
            .filter((p) => p.teamId === teamId)
            .forEach((p) => {
              batch.update(baseDoc.collection("players").doc(p.id), { teamId: "" });
            });
          await batch.commit();
        } else {
          setTeams((prev) => prev.filter((t) => t.id !== teamId));
          setRegisteredPlayers((prev) =>
            prev.map((p) => (p.teamId === teamId ? { ...p, teamId: "" } : p))
          );
        }
      };

      const handleAssignPlayerToTeam = async (playerId, targetTeamId) => {
        if (!playerId) return;
        if (fbStatus === "connected" && dbRef.current) {
          await dbRef.current
            .collection("pooters_hunt")
            .doc("main_game")
            .collection("players")
            .doc(playerId)
            .update({ teamId: targetTeamId });
        } else {
          setRegisteredPlayers((prev) =>
            prev.map((p) => (p.id === playerId ? { ...p, teamId: targetTeamId } : p))
          );
        }
      };

      // Players CRUD
      const generateRandomCode = () => {
        const code = Math.floor(1000 + Math.random() * 9000).toString();
        setNewPlayerCode(code);
      };

      const handleAdminAddPlayer = async (e) => {
        e.preventDefault();
        if (!newPlayerName.trim()) return;
        const id = "player_" + Date.now();
        const finalCode =
          newPlayerCode.trim() || Math.floor(1000 + Math.random() * 9000).toString();
        const newPlayer = {
          id,
          displayName: newPlayerName.trim(),
          secretCode: finalCode,
          teamId: newPlayerTeamId || ""
        };
        setNewPlayerName("");
        setNewPlayerCode("");

        if (fbStatus === "connected" && dbRef.current) {
          await dbRef.current
            .collection("pooters_hunt")
            .doc("main_game")
            .collection("players")
            .doc(id)
            .set(newPlayer);
        } else {
          setRegisteredPlayers((prev) => [...prev, newPlayer]);
        }
      };

      const handleDeletePlayer = async (playerId) => {
        if (fbStatus === "connected" && dbRef.current) {
          await dbRef.current
            .collection("pooters_hunt")
            .doc("main_game")
            .collection("players")
            .doc(playerId)
            .delete();
        } else {
          setRegisteredPlayers((prev) => prev.filter((p) => p.id !== playerId));
        }
      };

      const handleCopyCode = (player) => {
        const text = `${player.displayName} - Code: ${player.secretCode}`;
        if (navigator.clipboard && navigator.clipboard.writeText) {
          navigator.clipboard.writeText(text).catch(() => {});
        }
        setCopiedPlayerId(player.id);
        setTimeout(() => setCopiedPlayerId(null), 1800);
      };

      // Tasks CRUD
      const handleAdminAddTask = async (e) => {
        e.preventDefault();
        if (!newTaskTitle.trim()) return;
        const id = "task_" + Date.now();
        const newTask = {
          id,
          title: newTaskTitle.trim(),
          description: newTaskDesc.trim(),
          points: Number(newTaskPoints),
          isTeamTask: newTaskIsTeam,
          p1Id: newTaskIsTeam ? "" : newTaskP1,
          p2Id: newTaskIsTeam ? "" : newTaskP2
        };
        setNewTaskTitle("");
        setNewTaskDesc("");
        setNewTaskP1("");
        setNewTaskP2("");

        if (fbStatus === "connected" && dbRef.current) {
          await dbRef.current
            .collection("pooters_hunt")
            .doc("main_game")
            .collection("tasks")
            .doc(id)
            .set(newTask);
        } else {
          setTasks((prev) => [...prev, newTask]);
        }
      };

      const handleDeleteTask = async (taskId) => {
        if (fbStatus === "connected" && dbRef.current) {
          await dbRef.current
            .collection("pooters_hunt")
            .doc("main_game")
            .collection("tasks")
            .doc(taskId)
            .delete();
        } else {
          setTasks((prev) => prev.filter((t) => t.id !== taskId));
        }
      };

      // Task Submission (Uploads photo/video to Firebase Storage if connected, else saves locally)
      const openTaskSubmissionModal = (task) => {
        if (!currentTeam) {
          setErrorModal({
            isOpen: true,
            title: "Unassigned Player",
            message:
              "You are currently Unassigned! Ask the Organizer to assign you to a Squad before submitting tasks."
          });
          return;
        }
        clearSelectedMedia();
        setSubmissionText("");
        setTaskModal({ isOpen: true, task });
      };

      const handleCompleteTask = async () => {
        if (!currentTeam || !taskModal.task || !currentLoggedInPlayer || isSubmittingTask) return;

        setIsSubmittingTask(true);
        setUploadProgressPct(0);

        try {
          const { task } = taskModal;
          let finalMediaUrl =
            mediaFileUrl ||
            "https://images.unsplash.com/photo-1529156069898-49953e39b3ac?auto=format&fit=crop&w=800&q=80";
          const finalMediaType = mediaFileUrl ? mediaFileType : "image";

          // If connected to Firebase & user chose a local file/blob, upload to Firebase Storage
          if (fbStatus === "connected" && pendingUploadBlob && storageRef.current) {
            try {
              finalMediaUrl = await uploadBlobToFirebaseStorage(
                pendingUploadBlob,
                finalMediaType
              );
            } catch (storageErr) {
              // Fallback for compressed images if Storage bucket rules aren't open yet
              if (finalMediaType === "image" && mediaFileUrl.startsWith("data:image")) {
                finalMediaUrl = mediaFileUrl;
              } else {
                throw new Error(
                  "Firebase Storage upload failed (" +
                    (storageErr.message || "check Storage rules") +
                    ")."
                );
              }
            }
          }

          const id = "prog_" + Date.now();
          const newEntry = {
            id,
            teamId: currentTeam.id,
            taskId: task.id,
            userId: currentLoggedInPlayer.id,
            userName: currentLoggedInPlayer.displayName,
            points: Number(task.points) || 0,
            note: submissionText.trim() || "Completed challenge!",
            mediaUrl: finalMediaUrl,
            mediaType: finalMediaType,
            timestamp: Date.now()
          };

          if (fbStatus === "connected" && dbRef.current) {
            await dbRef.current
              .collection("pooters_hunt")
              .doc("main_game")
              .collection("progress")
              .doc(id)
              .set(newEntry);
          } else {
            setProgress((prev) => [newEntry, ...prev]);
          }

          setTaskModal({ isOpen: false, task: null });
          setSubmissionText("");
          clearSelectedMedia();
        } catch (err) {
          setErrorModal({
            isOpen: true,
            title: "Upload Error",
            message: err.message || "Could not submit task proof."
          });
        } finally {
          setIsSubmittingTask(false);
          setUploadProgressPct(0);
        }
      };

      // Status Pill Helper
      const renderConnectionBadge = (darkBg = true) => {
        if (fbStatus === "connected") {
          return (
            <span
              className={`inline-flex items-center gap-1.5 text-[11px] font-black uppercase px-2.5 py-1 rounded-full ${
                darkBg
                  ? "bg-emerald-500/20 text-emerald-300 border border-emerald-500/40"
                  : "bg-emerald-100 text-emerald-800 border border-emerald-300"
              }`}
            >
              <span className="w-2 h-2 rounded-full bg-emerald-400 animate-pulse" />
              Cloud Live Sync
            </span>
          );
        }
        if (fbStatus === "connecting") {
          return (
            <span className="inline-flex items-center gap-1.5 text-[11px] font-black uppercase px-2.5 py-1 rounded-full bg-amber-500/20 text-amber-300 border border-amber-500/40">
              Connecting...
            </span>
          );
        }
        if (fbStatus === "error") {
          return (
            <span className="inline-flex items-center gap-1.5 text-[11px] font-black uppercase px-2.5 py-1 rounded-full bg-rose-500/20 text-rose-300 border border-rose-500/40">
              Sync Error
            </span>
          );
        }
        return (
          <span
            className={`inline-flex items-center gap-1.5 text-[11px] font-black uppercase px-2.5 py-1 rounded-full ${
              darkBg
                ? "bg-white/10 text-amber-200 border border-white/15"
                : "bg-slate-200 text-slate-700"
            }`}
          >
            Local Demo Mode
          </span>
        );
      };

      // =========================================================================
      // 11. ORGANIZER PORTAL VIEW
      // =========================================================================
      if (portalMode === "organizer") {
        if (!isOrganizerAuthed) {
          return (
            <div className="min-h-screen bg-slate-900 text-white p-6 flex flex-col items-center justify-center">
              <div className="mb-4">{renderConnectionBadge(true)}</div>
              <Icon name="shield" size={64} className="mb-5 text-amber-400" />
              <h1 className="text-3xl font-black mb-2 text-center uppercase">Organizer Portal</h1>
              <p className="text-slate-400 mb-8 text-center text-sm font-medium">
                Enter password to manage Pooters Scavenger Hunt
              </p>

              <form onSubmit={handleOrganizerAuth} className="w-full max-w-sm flex flex-col gap-4">
                <input
                  type="password"
                  placeholder="Organizer Password (pooters2026)"
                  value={organizerPasswordInput}
                  onChange={(e) => setOrganizerPasswordInput(e.target.value)}
                  className="w-full px-5 py-4 rounded-xl text-slate-900 font-bold focus:outline-none focus:ring-4 focus:ring-amber-500"
                  required
                />
                <button
                  type="submit"
                  className="w-full bg-amber-500 hover:bg-amber-400 text-amber-950 font-black text-lg py-4 rounded-xl uppercase shadow-lg"
                >
                  Unlock Organizer Dashboard
                </button>
                <button
                  type="button"
                  onClick={() => setPortalMode("player")}
                  className="text-slate-400 hover:text-white font-bold text-sm mt-4 text-center"
                >
                  ← Back to Player Login
                </button>
              </form>

                      <label className="cursor-pointer block w-full bg-amber-100 hover:bg-amber-200 active:bg-amber-300 text-amber-950 font-black py-3.5 px-4 rounded-xl text-center border-2 border-dashed border-amber-400 transition-colors">
                        <span className="flex items-center justify-center gap-2 text-sm">
                          <Icon name="upload" size={18} />
                          {isProcessingMedia
                            ? "Optimizing Photo/Video..."
                            : "Tap to Select Photo or Video"}
                        </span>
                        <input
                          type="file"
                          accept="image/*,video/*"
                          onChange={handleFileUpload}
                          className="sr-only"
                        />
                      </label>

                      <div className="flex gap-2">
                        <button
                          type="button"
                          onClick={() => selectSampleMedia("image")}
                          className="text-xs bg-slate-100 hover:bg-slate-200 border border-slate-200 text-slate-700 font-bold py-2 px-3 rounded-xl flex-1 flex items-center justify-center gap-1.5"
                        >
                          <Icon name="image" size={14} /> Sample Photo
                        </button>
                        <button
                          type="button"
                          onClick={() => selectSampleMedia("video")}
                          className="text-xs bg-slate-100 hover:bg-slate-200 border border-slate-200 text-slate-700 font-bold py-2 px-3 rounded-xl flex-1 flex items-center justify-center gap-1.5"
                        >
                          <Icon name="video" size={14} /> Sample Video
                        </button>
                      </div>
                    </div>
                  ) : (
                    <div className="flex gap-2">
                      <input
                        type="url"
                        placeholder="https://... image or .mp4 URL"
                        value={mediaUrlInput}
                        onChange={(e) => setMediaUrlInput(e.target.value)}
                        className="flex-1 px-3.5 py-2.5 bg-slate-50 rounded-xl border-2 border-slate-200 text-slate-900 font-medium text-sm focus:border-amber-500 focus:outline-none"
                      />
                      <button
                        type="button"
                        onClick={handleUrlSubmit}
                        className="bg-amber-800 hover:bg-amber-900 text-white px-4 py-2.5 rounded-xl font-bold text-xs uppercase"
                      >
                        Attach
                      </button>
                    </div>
                  )}

                  {/* Live Media Preview */}
                  {mediaFileUrl && (
                    <div className="bg-slate-900 rounded-xl overflow-hidden border-2 border-emerald-500 shadow-md">
                      <div className="relative max-h-48 flex items-center justify-center bg-black">
                        {mediaFileType === "video" ? (
                          <video
                            src={mediaFileUrl}
                            controls
                            playsInline
                            className="max-h-48 w-full object-contain"
                          />
                        ) : (
                          <img
                            src={mediaFileUrl}
                            alt="Selected preview"
                            className="max-h-48 w-full object-contain"
                          />
                        )}
                      </div>
                      <div className="px-3 py-2 bg-emerald-950 text-emerald-100 flex items-center justify-between text-xs">
                        <div className="flex items-center gap-1.5 truncate pr-2">
                          <Icon name="checkCircle" size={14} className="text-emerald-400 shrink-0" />
                          <span className="font-bold truncate">
                            {mediaFileMeta?.name || "Media Ready"}
                          </span>
                          {mediaFileMeta?.sizeText && (
                            <span className="text-emerald-300/80 shrink-0">
                              ({mediaFileMeta.sizeText})
                            </span>
                          )}
                        </div>
                        <button
                          type="button"
                          onClick={clearSelectedMedia}
                          className="text-rose-300 hover:text-white font-bold uppercase shrink-0"
                        >
                          Remove
                        </button>
                      </div>
                    </div>
                  )}
                </div>

                <div className="bg-amber-50 border border-amber-200 p-3.5 rounded-xl flex items-center gap-3">
                  <Icon name="trophy" size={22} className="text-amber-600 shrink-0" />
                  <p className="font-bold text-amber-900 text-xs sm:text-sm">
                    Earns{" "}
                    <span className="text-amber-700 font-black text-base">
                      {taskModal.task.points} pts
                    </span>{" "}
                    for{" "}
                    {taskModal.task.isTeamTask ? "your squad" : "your squad (duel victory)"}.
                  </p>
                </div>
              </div>
            )}
          </Modal>

          {/* Media Viewer Lightbox Modal */}
          {mediaViewerModal.isOpen && mediaViewerModal.item && (
            <div className="fixed inset-0 bg-black/90 z-50 flex items-center justify-center p-4">
              <div className="bg-white rounded-2xl w-full max-w-lg overflow-hidden shadow-2xl relative">
                <div className="p-4 bg-slate-900 text-white flex justify-between items-center">
                  <div>
                    <h3 className="font-bold text-lg">
                      {mediaViewerModal.item.userName}'s Submission
                    </h3>
                    <p className="text-xs text-slate-400">{mediaViewerModal.item.note}</p>
                  </div>
                  <button
                    onClick={() => setMediaViewerModal({ isOpen: false, item: null })}
                    className="bg-slate-800 p-2 rounded-full text-slate-300 hover:text-white"
                  >
                    <Icon name="x" size={20} />
                  </button>
                </div>
                <div className="p-4 bg-black flex items-center justify-center max-h-[70vh]">
                  {mediaViewerModal.item.mediaType === "video" ? (
                    <video
                      src={mediaViewerModal.item.mediaUrl}
                      controls
                      autoPlay
                      playsInline
                      className="max-h-[60vh] w-auto rounded-lg"
                    />
                  ) : (
                    <img
                      src={mediaViewerModal.item.mediaUrl}
                      alt="Memory"
                      className="max-h-[60vh] w-auto object-contain rounded-lg"
                    />
                  )}
                </div>
              </div>
            </div>
          )}

          {/* Error / Notice Modal */}
          <Modal
            isOpen={errorModal.isOpen}
            onClose={() => setErrorModal({ isOpen: false, title: "Notice", message: "" })}
            title={errorModal.title}
            primaryAction={() => setErrorModal({ isOpen: false, title: "Notice", message: "" })}
            primaryLabel="Got it"
          >
            {errorModal.message}
          </Modal>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById("root"));
    root.render(<App />);
  </script>
</body>
</html>
